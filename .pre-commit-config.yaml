---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        entry: npm --prefix frontend run lint
        files: ^frontend/
        pass_filenames: false
      - id: prettier
        name: prettier
        language: system
        entry: npm --prefix frontend run format:check
        files: ^frontend/
        pass_filenames: false
      - id: stylelint
        name: stylelint
        language: system
        entry: npm --prefix frontend run lint:css
        files: ^frontend/
        pass_filenames: false

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  - repo: local
    hooks:
      - id: tflint
        name: tflint
        language: golang
        additional_dependencies: [github.com/terraform-linters/tflint@v0.65.0]
        entry: >-
          bash -c 'tflint --init --config="$PWD/.tflint.hcl" > /dev/null &&
          tflint --recursive --config="$PWD/.tflint.hcl"'
        files: \.tf$
        pass_filenames: false
