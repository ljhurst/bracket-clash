---
name: Deploy

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ljhurst/stych/.github/workflows/terraform.yml@v1
    with:
      plan-role-arn: arn:aws:iam::755958650241:role/stych/bracket-clash-ci-plan
      apply-role-arn: arn:aws:iam::755958650241:role/stych/bracket-clash-ci-apply

  site:
    needs: terraform
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      deployments: write
    uses: ljhurst/stych/.github/workflows/static-site.yml@feat/site-preview-workflow
    with:
      plan-role-arn: arn:aws:iam::755958650241:role/stych/bracket-clash-ci-plan
      apply-role-arn: arn:aws:iam::755958650241:role/stych/bracket-clash-ci-apply
      bucket: lj-bracket-clash
      distribution-id: EBB9LW6ZF9R1A
      node-version-file: frontend/.nvmrc
      site-dir: site
      build-command: >-
        cd frontend && npm ci && npm run build
        && mkdir -p ../site && cp -r index.html assets dist ../site/
