---
name: Deploy

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    uses: ljhurst/stych/.github/workflows/terraform.yml@v1
    with:
      plan-role-arn: arn:aws:iam::755958650241:role/stych/bracket-clash-ci-plan
      # yamllint disable-line rule:line-length
      apply-role-arn: arn:aws:iam::755958650241:role/stych/bracket-clash-ci-apply

  site:
    needs: terraform
    uses: ljhurst/stych/.github/workflows/static-site.yml@v1
    with:
      plan-role-arn: arn:aws:iam::755958650241:role/stych/bracket-clash-ci-plan
      # yamllint disable-line rule:line-length
      apply-role-arn: arn:aws:iam::755958650241:role/stych/bracket-clash-ci-apply
      bucket: lj-bracket-clash
      node-version-file: frontend/.nvmrc
      site-dir: site
      build-command: >-
        cd frontend && npm ci && npm run build
        && mkdir -p ../site && cp -r index.html assets dist ../site/
